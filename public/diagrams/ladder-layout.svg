<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-labelledby="title desc">
  <title id="title">Layout ladder di sei qubit fisici</title>
  <desc id="desc">Due file di tre qubit, con collegamenti lungo ciascuna fila e tra le due file.</desc>
  <style>
    .link { stroke: #898781; stroke-width: 3; }
    .qubit { fill: #fafaf8; stroke: #b5451b; stroke-width: 2; }
    text { fill: #1a1a1a; font: 13px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
    @media (prefers-color-scheme: dark) {
      .link { stroke: #9a9a9a; }
      .qubit { fill: #202024; stroke: #e8916a; }
      text { fill: #ececec; }
    }
  </style>
  <g class="link">
    <path d="M40 30H280M40 100H280M40 30V100M160 30V100M280 30V100" fill="none"/>
  </g>
  <g class="qubit">
    <circle cx="40" cy="30" r="16"/><circle cx="160" cy="30" r="16"/><circle cx="280" cy="30" r="16"/>
    <circle cx="40" cy="100" r="16"/><circle cx="160" cy="100" r="16"/><circle cx="280" cy="100" r="16"/>
  </g>
  <g><text x="40" y="30">1</text><text x="160" y="30">2</text><text x="280" y="30">3</text>
    <text x="40" y="100">4</text><text x="160" y="100">5</text><text x="280" y="100">6</text></g>
</svg>
